server {
    listen 8080 ssl;
    server_name ${SERVER_NAME};

    ssl_certificate /etc/ssl/fullchain.pem;
    ssl_certificate_key /etc/ssl/privkey.pem;

    # Frontend (главная страница)
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Monitoring API
    location /monitoring-api/ {
        # Проверяем origin и устанавливаем соответствующий CORS заголовок
        set $cors_origin "";
        if ($http_origin ~* "^https?://(localhost|127\.0\.0\.1|.*\.localhost)(:[0-9]+)?$") {
            set $cors_origin $http_origin;
        }
        if ($http_origin = "${URL_FRONT_SYSTEM}") {
            set $cors_origin $http_origin;
        }

        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            return 200;
        }

        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;

        # Убираем /monitoring-api из пути при проксировании
        rewrite ^/monitoring-api/(.*) /$1 break;
        proxy_pass https://monitoring-api:8083;
        proxy_ssl_verify off;

        # Добавляем дополнительные заголовки для Spring Security
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
    }

    # Flink Load
    location /flink-load/ {
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;

        # Убираем /flink-load из пути при проксировании
        rewrite ^/flink-load/(.*) /$1 break;
        proxy_pass http://flink_load_minio:62049;
        proxy_ssl_verify off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }

    location /vault/ {
            rewrite ^/vault/(.*) /$1 break;
            proxy_pass https://vault-server:8200;
            proxy_ssl_verify off;

            proxy_set_header X-Forwarded-For $proxy_protocol_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
     }


}

