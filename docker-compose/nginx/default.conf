map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}
server {
     listen 443 ssl;
     server_name ${SERVER_NAME};

     ssl_certificate /etc/ssl/fullchain.pem;
     ssl_certificate_key /etc/ssl/privkey.pem;


# Frontend (главная страница)
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Monitoring API
    location /monitoring-api/ {
        # Проверяем origin и устанавливаем соответствующий CORS заголовок
        set $cors_origin "";

       #  if ($http_origin ~* "^https?://(bitdive\.io|localhost|127\.0\.0\.1)(:[0-9]+)?$") {
       #      set $cors_origin $http_origin;
      #   }

        if ($http_origin ~* "^https?://(bitdive\.io)(:[0-9]+)?$") {
            set $cors_origin $http_origin;
        }
        if ($http_origin = "${URL_FRONT_SYSTEM}") {
            set $cors_origin $http_origin;
        }

        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            return 200;
        }

        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;

        # Убираем /monitoring-api из пути при проксировании
        rewrite ^/monitoring-api/(.*) /$1 break;
        proxy_pass https://monitoring-api:8083;
        proxy_ssl_verify off;

        # Добавляем дополнительные заголовки для Spring Security
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
    }
    # Flink Load
    location /flink-load/ {
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;

        # Убираем /flink-load из пути при проксировании
        rewrite ^/flink-load/(.*) /$1 break;
        proxy_pass http://flink_load_minio:62049;
        proxy_ssl_verify off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }

    # Flink Load
        location /file-acceptor/ {
            client_max_body_size 200M;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;

            # Убираем /flink-load из пути при проксировании
            rewrite ^/file-acceptor/(.*) /$1 break;
            proxy_pass http://file-acceptor:8082;
            proxy_ssl_verify off;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
        }

    location /vault/ {
            rewrite ^/vault/(.*) /$1 break;
            proxy_pass https://vault-server:8200;
            proxy_ssl_verify off;

            proxy_set_header X-Forwarded-For $proxy_protocol_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
     }


         location /keyCloak/ {
             proxy_pass https://keycloak:8443;
             proxy_ssl_verify off;

             proxy_set_header Host $host;
             proxy_set_header X-Real-IP $remote_addr;
             proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
             proxy_set_header X-Forwarded-Proto $scheme;
             proxy_set_header X-Forwarded-Host $host;
             proxy_set_header X-Forwarded-Port 443;

             # Important for Keycloak
             proxy_set_header X-Forwarded-Prefix /KeyCloak;

             # WebSocket support
             proxy_http_version 1.1;
             proxy_set_header Upgrade $http_upgrade;
             proxy_set_header Connection "upgrade";

             # Timeouts
             proxy_connect_timeout 60s;
             proxy_send_timeout 60s;
             proxy_read_timeout 60s;

             # Buffer settings
             proxy_buffering on;
             proxy_buffer_size 128k;
             proxy_buffers 4 256k;
             proxy_busy_buffers_size 256k;
         }


  # SSE endpoint для MCP (с префиксом /mcp)
  location /mcp/sse {
    proxy_http_version 1.1;
    proxy_pass http://mcp-server:8089/sse;
    
    # SSE требует отключения буферизации
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header X-Accel-Buffering no;
    proxy_set_header Connection keep-alive;
    chunked_transfer_encoding on;
    
    # Таймауты для долгих соединений
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 3600s;
    
    # Заголовки
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # CORS
    add_header Access-Control-Allow-Origin      "*"     always;
    add_header Access-Control-Allow-Credentials "true"  always;
    add_header Cache-Control                    "no-cache" always;
  }

  # SSE endpoint для MCP (без префикса /mcp - для обратной совместимости)
  location /sse {
    proxy_http_version 1.1;
    proxy_pass http://mcp-server:8089/sse;
    
    # SSE требует отключения буферизации
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header X-Accel-Buffering no;
    proxy_set_header Connection keep-alive;
    chunked_transfer_encoding on;
    
    # Таймауты для долгих соединений
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 3600s;
    
    # Заголовки
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # CORS
    add_header Access-Control-Allow-Origin      "*"     always;
    add_header Access-Control-Allow-Credentials "true"  always;
    add_header Cache-Control                    "no-cache" always;
  }

  # Message endpoint для MCP (без префикса /mcp)
  location /message {
    proxy_http_version 1.1;
    proxy_pass http://mcp-server:8089/message;
    proxy_buffering off;
    
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # CORS
    add_header Access-Control-Allow-Origin      "*"     always;
    add_header Access-Control-Allow-Methods     "GET, POST, OPTIONS, PUT, DELETE" always;
    add_header Access-Control-Allow-Headers     "Content-Type, Authorization, X-Requested-With" always;
    add_header Access-Control-Allow-Credentials "true"  always;
    
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin      "*"     always;
      add_header Access-Control-Allow-Methods     "GET, POST, OPTIONS, PUT, DELETE" always;
      add_header Access-Control-Allow-Headers     "Content-Type, Authorization, X-Requested-With" always;
      add_header Access-Control-Allow-Credentials "true"  always;
      return 204;
    }
  }

  # Message endpoint для MCP (с префиксом /mcp)
  location /mcp/message {
    proxy_http_version 1.1;
    # Проксируем напрямую, сохраняя путь /mcp/message
    proxy_pass http://mcp-server:8089/mcp/message;
    proxy_buffering off;
    
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # CORS
    add_header Access-Control-Allow-Origin      "*"     always;
    add_header Access-Control-Allow-Methods     "GET, POST, OPTIONS, PUT, DELETE" always;
    add_header Access-Control-Allow-Headers     "Content-Type, Authorization, X-Requested-With" always;
    add_header Access-Control-Allow-Credentials "true"  always;
    
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin      "*"     always;
      add_header Access-Control-Allow-Methods     "GET, POST, OPTIONS, PUT, DELETE" always;
      add_header Access-Control-Allow-Headers     "Content-Type, Authorization, X-Requested-With" always;
      add_header Access-Control-Allow-Credentials "true"  always;
      return 204;
    }
  }

  location = /mcp {
    return 301 /mcp/;
  }
  
  # MCP Server (остальные эндпоинты)
  location /mcp/ {
    proxy_http_version 1.1;

    # Удаляем префикс /mcp/ за счёт слеша в proxy_pass:
    # запрос /mcp/api/v1/foo -> апстриму пойдёт /api/v1/foo
    proxy_pass http://mcp-server:8089/;

    # WebSocket / streaming
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;

    # Пробрасываем нужные заголовки
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_set_header X-Original-URI    $request_uri;
    proxy_set_header X-Original-Method $request_method;

    # Полезно, если бэкенд хочет знать базовый префикс на внешней стороне
    proxy_set_header X-Forwarded-Prefix /mcp;

    # Если апстрим отдаёт редиректы типа Location: /login — вернём префикс /mcp
    proxy_redirect ~^(/.*)$ /mcp$1;

    # CORS (при желании — ограничьте Origin)
    add_header Access-Control-Allow-Origin      "*"     always;
    add_header Access-Control-Allow-Methods     "GET, POST, OPTIONS, PUT, DELETE" always;
    add_header Access-Control-Allow-Headers     "Content-Type, Authorization, X-Requested-With" always;
    add_header Access-Control-Allow-Credentials "true"  always;

    # Preflight обрабатываем на уровне Nginx
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin      "*"     always;
      add_header Access-Control-Allow-Methods     "GET, POST, OPTIONS, PUT, DELETE" always;
      add_header Access-Control-Allow-Headers     "Content-Type, Authorization, X-Requested-With" always;
      add_header Access-Control-Allow-Credentials "true"  always;
      return 204;
    }

    # Если апстрим HTTPS — используйте https:// в proxy_pass и тогда можно управлять verify:
    # proxy_pass https://mcp-server:8089/;
    # proxy_ssl_server_name on;
    # proxy_ssl_verify off;  # или включите и настройте trust
  }

}
