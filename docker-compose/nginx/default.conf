map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}
server {
     listen 443 ssl;
     server_name ${SERVER_NAME};

     ssl_certificate /etc/ssl/fullchain.pem;
     ssl_certificate_key /etc/ssl/privkey.pem;

    # Docker DNS (so upstream resolves container names after restarts)
    resolver 127.0.0.11 ipv6=off valid=10s;


# Frontend (main page)
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Monitoring API
    location /monitoring-api/ {
        # Check origin and set the appropriate CORS header
        set $cors_origin "";

        if ($http_origin ~* "^https?://(bitdive\.io|localhost|127\.0\.0\.1)(:[0-9]+)?$") {
            set $cors_origin $http_origin;
        }

#         if ($http_origin ~* "^https?://(bitdive\.io)(:[0-9]+)?$") {
#             set $cors_origin $http_origin;
#         }
        if ($http_origin = "${URL_FRONT_SYSTEM}") {
            set $cors_origin $http_origin;
        }

        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            return 200;
        }

        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;

        # Remove /monitoring-api from the path when proxying
        rewrite ^/monitoring-api/(.*) /$1 break;
        proxy_pass https://monitoring-api:8083;
        proxy_ssl_verify off;

        # Add additional headers for Spring Security
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
    }
    # Flink Load
    location /flink-load/ {
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;

        # Remove /flink-load from the path when proxying
        rewrite ^/flink-load/(.*) /$1 break;
        proxy_pass http://flink_load_minio:62049;
        proxy_ssl_verify off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }

    # Flink Load
        location /file-acceptor/ {
            client_max_body_size 200M;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;

            # Remove /file-acceptor from the path when proxying
            rewrite ^/file-acceptor/(.*) /$1 break;
            proxy_pass http://file-acceptor:8082;
            proxy_ssl_verify off;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
        }

    location /vault/ {
            rewrite ^/vault/(.*) /$1 break;
            proxy_pass https://vault-server:8200;
            proxy_ssl_verify off;

            proxy_set_header X-Forwarded-For $proxy_protocol_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
     }


         location /keyCloak/ {
             # Important: proxy_pass via variable forces Nginx to use resolver and
             # not "stick" to the old keycloak container IP after restarts.
             set $keycloak_upstream https://keycloak:8443;
             proxy_pass $keycloak_upstream;
             proxy_ssl_verify off;

             proxy_set_header Host $host;
             proxy_set_header X-Real-IP $remote_addr;
             proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
             proxy_set_header X-Forwarded-Proto $scheme;
             proxy_set_header X-Forwarded-Host $host;
             proxy_set_header X-Forwarded-Port 443;

             # Important for Keycloak
             proxy_set_header X-Forwarded-Prefix /keyCloak;

             # WebSocket support
             proxy_http_version 1.1;
             proxy_set_header Upgrade $http_upgrade;
             proxy_set_header Connection "upgrade";

             # Timeouts
             proxy_connect_timeout 60s;
             proxy_send_timeout 60s;
             proxy_read_timeout 60s;

             # Buffer settings
             proxy_buffering on;
             proxy_buffer_size 128k;
             proxy_buffers 4 256k;
             proxy_busy_buffers_size 256k;
         }


  # SSE endpoint for MCP (with /mcp prefix)
  location /mcp/sse {
    proxy_http_version 1.1;
    proxy_pass http://mcp-server:8089/sse;
    
    # SSE requires disabling buffering
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header X-Accel-Buffering no;
    proxy_set_header Connection keep-alive;
    chunked_transfer_encoding on;
    
    # Timeouts for long-lived connections
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 3600s;
    
    # Headers
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # CORS
    add_header Access-Control-Allow-Origin      "*"     always;
    add_header Access-Control-Allow-Credentials "true"  always;
    add_header Cache-Control                    "no-cache" always;
  }

  # SSE endpoint for MCP (without /mcp prefix - for backward compatibility)
  location /sse {
    proxy_http_version 1.1;
    proxy_pass http://mcp-server:8089/sse;
    
    # SSE requires disabling buffering
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header X-Accel-Buffering no;
    proxy_set_header Connection keep-alive;
    chunked_transfer_encoding on;
    
    # Timeouts for long-lived connections
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 3600s;
    
    # Headers
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # CORS
    add_header Access-Control-Allow-Origin      "*"     always;
    add_header Access-Control-Allow-Credentials "true"  always;
    add_header Cache-Control                    "no-cache" always;
  }

  # Message endpoint for MCP (without /mcp prefix)
  location /message {
    proxy_http_version 1.1;
    proxy_pass http://mcp-server:8089/message;
    proxy_buffering off;
    
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # CORS
    add_header Access-Control-Allow-Origin      "*"     always;
    add_header Access-Control-Allow-Methods     "GET, POST, OPTIONS, PUT, DELETE" always;
    add_header Access-Control-Allow-Headers     "Content-Type, Authorization, X-Requested-With" always;
    add_header Access-Control-Allow-Credentials "true"  always;
    
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin      "*"     always;
      add_header Access-Control-Allow-Methods     "GET, POST, OPTIONS, PUT, DELETE" always;
      add_header Access-Control-Allow-Headers     "Content-Type, Authorization, X-Requested-With" always;
      add_header Access-Control-Allow-Credentials "true"  always;
      return 204;
    }
  }

  # Message endpoint for MCP (with /mcp prefix)
  location /mcp/message {
    proxy_http_version 1.1;
    # Proxy directly, preserving the /mcp/message path
    proxy_pass http://mcp-server:8089/mcp/message;
    proxy_buffering off;
    
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # CORS
    add_header Access-Control-Allow-Origin      "*"     always;
    add_header Access-Control-Allow-Methods     "GET, POST, OPTIONS, PUT, DELETE" always;
    add_header Access-Control-Allow-Headers     "Content-Type, Authorization, X-Requested-With" always;
    add_header Access-Control-Allow-Credentials "true"  always;
    
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin      "*"     always;
      add_header Access-Control-Allow-Methods     "GET, POST, OPTIONS, PUT, DELETE" always;
      add_header Access-Control-Allow-Headers     "Content-Type, Authorization, X-Requested-With" always;
      add_header Access-Control-Allow-Credentials "true"  always;
      return 204;
    }
  }

  location = /mcp {
    return 301 /mcp/;
  }
  
  # MCP Server (remaining endpoints)
  location /mcp/ {
    proxy_http_version 1.1;

    # Remove /mcp/ prefix via trailing slash in proxy_pass:
    # request /mcp/api/v1/foo -> upstream receives /api/v1/foo
    proxy_pass http://mcp-server:8089/;

    # WebSocket / streaming
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;

    # Forward necessary headers
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_set_header X-Original-URI    $request_uri;
    proxy_set_header X-Original-Method $request_method;

    # Useful if backend needs to know the base prefix on the external side
    proxy_set_header X-Forwarded-Prefix /mcp;

    # If upstream sends redirects like Location: /login — restore the /mcp prefix
    proxy_redirect ~^(/.*)$ /mcp$1;

    # CORS (optionally restrict Origin)
    add_header Access-Control-Allow-Origin      "*"     always;
    add_header Access-Control-Allow-Methods     "GET, POST, OPTIONS, PUT, DELETE" always;
    add_header Access-Control-Allow-Headers     "Content-Type, Authorization, X-Requested-With" always;
    add_header Access-Control-Allow-Credentials "true"  always;

    # Handle preflight at the Nginx level
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin      "*"     always;
      add_header Access-Control-Allow-Methods     "GET, POST, OPTIONS, PUT, DELETE" always;
      add_header Access-Control-Allow-Headers     "Content-Type, Authorization, X-Requested-With" always;
      add_header Access-Control-Allow-Credentials "true"  always;
      return 204;
    }

    # If upstream is HTTPS — use https:// in proxy_pass and then you can manage verify:
    # proxy_pass https://mcp-server:8089/;
    # proxy_ssl_server_name on;
    # proxy_ssl_verify off;  # or enable and configure trust
  }

}
