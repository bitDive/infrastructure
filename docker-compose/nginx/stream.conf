stream {
    # Определяем upstream для file-acceptor
    upstream file_acceptor_backend {
        server file-acceptor:8082;
    }
    
    # Upstream для HTTP-сервисов (перенаправляем обратно на nginx HTTP)
    upstream http_backend {
        server 127.0.0.1:8080;
    }

    # Карта для определения backend по SNI
    map $ssl_preread_server_name $backend_pool {
        file-acceptor.${SERVER_NAME} file_acceptor_backend;
        default http_backend;
    }

    # Основной сервер на порту 443
    server {
        listen 443;
        ssl_preread on;
        proxy_pass $backend_pool;
        proxy_timeout 3s;
        proxy_responses 1;
        error_log /var/log/nginx/stream.log;
    }
} 