services:

  vault:
    image: frolikoveabitdive/bitdive-vault:latest
    container_name: vault-server
    environment:
      VAULT_ADDR: ${VAULT_ADDR}
      VAULT_SKIP_VERIFY: 'true'
    volumes:
      - ./vault/data:/vault/file
      - ./vault/logs:/vault/logs
      - ./configVault:/vault/config:rw
      - ./vault/keys:/vault/keys
      - ./vault/ssl:/vault/ssl
      - ./.env:/vault/.env
    command: vault server -config=/vault/config/config.hcl
    cap_add:
      - IPC_LOCK
    networks:
      - flink-network

  init-db-ssl:
    image: busybox
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_PG_USER_PASSWORD: ${CLICKHOUSE_PG_USER_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./vault/ssl/postgres-server:/var/lib/postgresql/certs/
      - ./vault/ssl/postgres-client-keycloak:/var/lib/postgresql-client/certs/
      - ./vault/ssl/clickhouse-server:/work/certs
      - ./postgresConfig/postgres-init:/work/postgres-init
    command: |
      sh -e -c '
        echo "[INIT] Настройка сертификатов..."
        chown -R 999:999 /var/lib/postgresql/certs &&
        chmod 600 /var/lib/postgresql/certs/server.key &&
        chmod 644 /var/lib/postgresql/certs/server.crt &&
        chmod 644 /var/lib/postgresql/certs/ca.crt &&

        chown -R 101:101 /work/certs &&
        chmod 755 /work/certs &&
        chmod 600 /work/certs/server.key &&
        chmod 644 /work/certs/server.crt /work/certs/ca.crt &&
      
        chown -R 1000:0 /var/lib/postgresql-client/certs &&
        chmod 644 /var/lib/postgresql-client/certs/ca.crt &&
        chmod 644 /var/lib/postgresql-client/certs/server.key &&
        chmod 644 /var/lib/postgresql-client/certs/server.crt &&

      echo "[INIT] Генерация schema.sql..."
      if [ -z "$CLICKHOUSE_PG_USER_PASSWORD" ]; then
        echo "[ERROR] CLICKHOUSE_PG_USER_PASSWORD не задан!" >&2
        exit 1
      fi
      
      cat > /work/postgres-init/01_schema.sql <<EOF
      create schema alerting;
      CREATE DATABASE keycloak;
      CREATE EXTENSION IF NOT EXISTS pgcrypto;
      CREATE EXTENSION IF NOT EXISTS pg_cron;
      CREATE EXTENSION IF NOT EXISTS plpython3u;
      CREATE USER clickhouse_user WITH PASSWORD '\''$${CLICKHOUSE_PG_USER_PASSWORD}'\'';
      GRANT CONNECT ON DATABASE "${POSTGRES_DB}" TO clickhouse_user;
      GRANT USAGE ON SCHEMA public TO clickhouse_user;
      GRANT SELECT ON ALL TABLES IN SCHEMA public TO clickhouse_user;
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO clickhouse_user;
      EOF
      
      chmod 644 /work/postgres-init/01_schema.sql
      echo "[OK] schema.sql успешно создан"
      '
    depends_on:
      - init-clickhouse-collections
      - postgres
      - clickhouse


  init-container-ssl:
    image: busybox
    depends_on:
      - init-db-postgres
      - minio
      - keycloak
      - monitoring-api
      - flink_load
      - file-acceptor
      - frontend
      - mcp-server
      - nginx



  nginx:
    image: nginx:1.27.4
    container_name: nginx-ssl-proxy
    volumes:
      - ./nginx/default.conf:/etc/nginx/templates/conf.d/default.conf.template
      - ./nginx/:/etc/ssl:ro
    ports:
      - "443:443"
    environment:
      - SERVER_NAME=${SERVER_NAME}
      - URL_FRONT_SYSTEM=${URL_FRONT_SYSTEM}
    command: >
      /bin/sh -c "
      envsubst '$$SERVER_NAME $$URL_FRONT_SYSTEM' < /etc/nginx/templates/conf.d/default.conf.template > /etc/nginx/conf.d/default.conf &&
      exec nginx -g 'daemon off;'"
    networks:
      - flink-network
    depends_on:
      - init-db-postgres
      - init-db-clickhouse
      - minio
      - keycloak
      - monitoring-api
      - flink_load
      - file-acceptor
      - frontend
      - mcp-server


  postgres:
    image: frolikoveabitdive/bitdive-postgres:latest
    container_name: postgres-bitdive
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./postgresql:/var/lib/postgresql/data
      - ./postgresConfig/postgres-init:/docker-entrypoint-initdb.d
      - ./postgresConfig/pg_hba.conf:/etc/postgresql/pg_hba.conf
      - ./postgresConfig/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./vault/ssl/postgres-server:/var/lib/postgresql/certs/
    command:
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"
    restart: unless-stopped
    networks:
      - flink-network

  clickhouse:
    image: clickhouse/clickhouse-server:25.9.2.1  # лучше закрепить версию, а не :latest
    container_name: clickhouse-bitdive
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      PGSSLMODE: disable
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      # Монтируем только конкретные конфигурационные файлы в режиме read-only
      - ./clickhouse_config/users.d/admin.xml:/etc/clickhouse-server/users.d/admin.xml:ro
      - ./clickhouse_config/users.d/user_ch.xml:/etc/clickhouse-server/users.d/user_ch.xml:ro
      - ./clickhouse_config/users.d/big-queries.xml:/etc/clickhouse-server/users.d/big-queries.xml:ro
      - ./clickhouse_config/users.d/low_mem.xml:/etc/clickhouse-server/users.d/low_mem.xml:ro
      - ./clickhouse_config/config.d/ssl.xml:/etc/clickhouse-server/config.d/ssl.xml:ro
      - ./clickhouse_config/config.d/tmp.xml:/etc/clickhouse-server/config.d/tmp.xml:ro
      - ./clickhouse_config/config.d/20-disable-logs.xml:/etc/clickhouse-server/config.d/20-disable-logs.xml:ro
      - ./clickhouse_config/config.d/logging.xml:/etc/clickhouse-server/config.d/logging.xml:ro
      - ./vault/ssl/clickhouse-server:/etc/clickhouse-server/certs:ro
      - ./clickhouse_data:/var/lib/clickhouse
      - ./clickhouse_logs:/var/log/clickhouse-server
      - ./clickhouse_tmp:/var/lib/clickhouse/tmp:rw
    networks:
      - flink-network

  minio:
    image: minio/minio:RELEASE.2024-10-02T17-50-41Z
    container_name: minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DOMAIN: ${MINIO_DOMAIN}
    volumes:
      - ./minio/data:/data
    command: server --console-address "${MINIO_CONSOLE_ADDRESS}" /data
    networks:
      - flink-network

  keycloak:
    image: keycloak/keycloak:26.0
    container_name: keycloak
    restart: unless-stopped
    volumes:
      - ./vault/ssl/postgres-client-keycloak/keystore.jks:/etc/keycloak/postgres-keystore.jks
      - ./vault/ssl/postgres-client-keycloak/truststore.jks:/etc/keycloak/postgres-truststore.jks
      - ./vault/ssl/keycloak-https/keystore.jks:/etc/keycloak/https-keystore.jks
      - ./vault/ssl/keycloak-https/truststore.jks:/etc/keycloak/https-truststore.jks
      - ./vault/ssl/postgres-client-keycloak:/opt/keycloak/postgres:ro
      - ./vault/ssl/smtp-zoho/smtp-zoho.pem:/opt/keycloak/truststores
    environment:
      KC_DB: postgres
      KC_DB_URL: ${KEYCLOAK_DB_URL}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_HOSTNAME: ${SERVER_NAME}
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: 'false'
      KC_HEALTH_ENABLED: 'true'
      KC_HTTP_RELATIVE_PATH: '/keyCloak'
      PROXY_ADDRESS_FORWARDING: 'true'
      KC_HTTP_ENABLED: ${KEYCLOAK_HTTP_ENABLED}
      KC_HTTP_SSL_PORT: ${KEYCLOAK_HTTP_SSL_PORT}
      KC_HTTPS_KEY_STORE_FILE: "/etc/keycloak/https-keystore.jks"
      KC_HTTPS_KEY_STORE_PASSWORD: "${KEYCLOAK_KEY_STORE_PASSWORD}"
    networks:
      - flink-network
    command: [ "start" ]


  init-db-clickhouse:
    image: frolikoveabitdive/bitdive-db-liquibase-clickhouse:latest
    container_name: bitdive-init-db-clickhouse
    depends_on:
      - init-clickhouse-collections
    environment:
      CH_URL: jdbc:clickhouse://${CLICKHOUSE_HOST}:${CLICKHOUSE_PORT}/${CLICKHOUSE_DB}
      CH_USER: admin
      CH_PASS: ${CLICKHOUSE_PASSWORD}

      VAULT_URL: ${VAULT_ADDR_CONTAINER}
      VAULT_LOGIN: ${VAULT_LOGIN}
      VAULT_PASSWORD: ${VAULT_PASSWORD}

      VAULT_CERTIFICATION_DB_COMMON_NAME: ${VAULT_CERT_DB_COMMON_NAME}
      VAULT_CERTIFICATION_DB_ALT_NAME: ${VAULT_CERT_DB_ALT_NAME}
      VAULT_CERTIFICATION_DB_TTL: ${VAULT_CERT_DB_TTL}
    networks:
      - flink-network

  init-clickhouse-collections:
    image: clickhouse/clickhouse-server:25.9.2.1
    container_name: init-clickhouse-collections
    depends_on:
      - clickhouse
    environment:
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_PG_USER_PASSWORD: ${CLICKHOUSE_PG_USER_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./vault/ssl/clickhouse-server:/etc/clickhouse-server/certs:ro
    command:
      - /bin/bash
      - -c
      - |
        echo '[INIT] Ожидание доступности ClickHouse (порт 9000)...'
        sleep 10
        until clickhouse-client \
              --host $${CLICKHOUSE_HOST} \
              --port 9000 \
              --user $${CLICKHOUSE_USER} \
              --password $${CLICKHOUSE_PASSWORD} \
              --query 'SELECT 1' \
              2>/dev/null; do
          echo 'ClickHouse недоступен, ждем...'
          sleep 3
        done

        echo '[INIT] Создание базы данных $${CLICKHOUSE_DB}...'
        clickhouse-client \
              --host $${CLICKHOUSE_HOST} \
              --port 9000 \
              --user $${CLICKHOUSE_USER} \
              --password $${CLICKHOUSE_PASSWORD} \
              --query "CREATE DATABASE IF NOT EXISTS $${CLICKHOUSE_DB}"

        echo '[INIT] Создание named collection postgres_creds...'
        clickhouse-client \
              --host $${CLICKHOUSE_HOST} \
              --port 9000 \
              --user $${CLICKHOUSE_USER} \
              --password $${CLICKHOUSE_PASSWORD} \
              --query "
                CREATE NAMED COLLECTION IF NOT EXISTS postgres_creds
                AS host = '$${POSTGRES_HOST}', port = 5432,
                   user = 'clickhouse_user', password = '$${CLICKHOUSE_PG_USER_PASSWORD}',
                   database = '$${POSTGRES_DB}';
              "

        echo '[OK] Инициализация ClickHouse завершена'
    networks:
      - flink-network


  init-db-postgres:
    image: frolikoveabitdive/bitdive-db-liquibase-postgres:latest
    container_name: bitdive-init-db-postgres
    depends_on:
      - init-db-clickhouse
    environment:
      POSTGRES_URL: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASS: ${POSTGRES_PASSWORD}

      VAULT_URL: ${VAULT_ADDR_CONTAINER}
      VAULT_LOGIN: ${VAULT_LOGIN}
      VAULT_PASSWORD: ${VAULT_PASSWORD}

      VAULT_CERTIFICATION_DB_COMMON_NAME: ${VAULT_CERT_DB_COMMON_NAME}
      VAULT_CERTIFICATION_DB_ALT_NAME: ${VAULT_CERT_DB_ALT_NAME}
      VAULT_CERTIFICATION_DB_TTL: ${VAULT_CERT_DB_TTL}
    networks:
      - flink-network

  monitoring-api:
    image: frolikoveabitdive/bitdive-monitoring-api:latest
    container_name: monitoring-api
    environment:
      POSTGRES_URL: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASS: ${POSTGRES_PASSWORD}

      CH_URL: jdbc:clickhouse://${CLICKHOUSE_HOST}:${CLICKHOUSE_PORT}/${CLICKHOUSE_DB}
      CH_USER: ${CLICKHOUSE_USER}
      CH_PASS: ${CLICKHOUSE_PASSWORD}

      VAULT_URL: ${VAULT_ADDR_CONTAINER}
      VAULT_LOGIN: ${VAULT_LOGIN}
      VAULT_PASSWORD: ${VAULT_PASSWORD}

      VAULT_CERTIFICATION_DB_COMMON_NAME: ${VAULT_CERT_DB_COMMON_NAME}
      VAULT_CERTIFICATION_DB_ALT_NAME: ${VAULT_CERT_DB_ALT_NAME}
      VAULT_CERTIFICATION_DB_TTL: ${VAULT_CERT_DB_TTL}

      VAULT_CERTIFICATION_DB_CLICKHOUSE_COMMON_NAME: ${VAULT_CERT_DB_CH_COMMON_NAME}
      VAULT_CERTIFICATION_DB_CLICKHOUSE_ALT_NAME: ${VAULT_CERT_DB_CH_ALT_NAME}
      VAULT_CERTIFICATION_DB_CLICKHOUSE_TTL: ${VAULT_CERTIFICATION_DB_CH_TTL}

      VAULT_CERTIFICATION_SERVICE_COMMON_NAME: ${VAULT_CERT_SERVICE_COMMON_NAME}
      VAULT_CERTIFICATION_SERVICE_ACCEPTOR_ALT_NAMES: ${VAULT_CERT_SERVICE_ALT_NAMES}
      VAULT_CERTIFICATION_SERVICE_ACCEPTOR_TTL: ${VAULT_CERT_SERVICE_TTL}

      VAULT_CERTIFICATION_KEY_CLOAK_COMMON_NAME: ${VAULT_CERT_KEYCLOAK_COMMON_NAME}
      VAULT_CERTIFICATION_KEY_CLOAK_ALT_NAME: ${VAULT_CERT_KEYCLOAK_ALT_NAME}
      VAULT_CERTIFICATION_KEY_CLOAK_TTL: ${VAULT_CERT_KEYCLOAK_TTL}

      URL_FRONT_SYSTEM: ${URL_FRONT_SYSTEM}

      KEY_CLOAK_URL: ${KEYCLOAK_REALM_URL}
      SERVICE_ENABLE_SLL_CONNECT: 'true'

      REACT_APP_KEYCLOAK_URL: ${KEYCLOAK_CONTAINER}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      TOKEN_SECRET: ${TOKEN_SECRET}

      APP_EMAIL_SMTP_HOST: ${APP_EMAIL_SMTP_HOST}
      APP_EMAIL_SMTP_PORT: ${APP_EMAIL_SMTP_PORT}
      APP_EMAIL_SMTP_ALERT_USER: ${APP_EMAIL_SMTP_ALERT_USER}
      APP_EMAIL_SMTP_ALERT_PASSWORD: ${APP_EMAIL_SMTP_ALERT_PASSWORD}
      APP_EMAIL_SMTP_INFORMATION_USER: ${APP_EMAIL_SMTP_INFORMATION_USER}
      APP_EMAIL_SMTP_INFORMATION_PASSWORD: ${APP_EMAIL_SMTP_INFORMATION_PASSWORD}

    restart: unless-stopped
    networks:
      - flink-network


  flink_load:
    image: frolikoveabitdive/bitdive-flink-write-minio:latest
    container_name: flink_load_minio
    restart: unless-stopped
    environment:
      MINIO_USER: ${MINIO_ROOT_USER}
      MINIO_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_END_POINT: ${MINIO_ENDPOINT}
      POSTGRES_URL: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASS: ${POSTGRES_PASSWORD}
      CH_URL: jdbc:clickhouse://${CLICKHOUSE_HOST}:${CLICKHOUSE_PORT}/${CLICKHOUSE_DB}
      CH_USER: ${CLICKHOUSE_USER}
      CH_PASS: ${CLICKHOUSE_PASSWORD}
      VAULT_URL: ${VAULT_ADDR_CONTAINER}
      VAULT_LOGIN: ${VAULT_LOGIN}
      VAULT_PASSWORD: ${VAULT_PASSWORD}
      VAULT_CERTIFICATION_DB_COMMON_NAME: ${VAULT_CERT_DB_COMMON_NAME}
      VAULT_CERTIFICATION_DB_ALT_NAME: ${VAULT_CERT_DB_ALT_NAME}
      VAULT_CERTIFICATION_DB_TTL: ${VAULT_CERT_DB_TTL}
      VAULT_CERTIFICATION_DB_CLICKHOUSE_COMMON_NAME: ${VAULT_CERT_DB_CH_COMMON_NAME}
      VAULT_CERTIFICATION_DB_CLICKHOUSE_ALT_NAME: ${VAULT_CERT_DB_CH_ALT_NAME}
      VAULT_CERTIFICATION_DB_CLICKHOUSE_TTL: ${VAULT_CERTIFICATION_DB_CH_TTL}
      TOTAL_PROCESS_MEMORY: ${TOTAL_PROCESS_MEMORY}
    depends_on:
      - minio
    networks:
      - flink-network


  file-acceptor:
    image: frolikoveabitdive/bitdive-file-acceptor:latest
    container_name: file-acceptor
    restart: unless-stopped
    environment:
      MINIO_USER: ${MINIO_ROOT_USER}
      MINIO_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_END_POINT: ${MINIO_ENDPOINT}
      VAULT_URL: ${VAULT_ADDR_CONTAINER}
      VAULT_LOGIN: ${VAULT_LOGIN}
      VAULT_PASSWORD: ${VAULT_PASSWORD}
      VAULT_CERTIFICATION_SERVICE_ACCEPTOR_COMMON_NAME: ${VAULT_CERT_SERVICE_COMMON_NAME_FILE_ACCEPTOR}
      VAULT_CERTIFICATION_SERVICE_COMMON_NAME: ${VAULT_CERT_SERVICE_COMMON_NAME_FILE_ACCEPTOR}
      VAULT_CERTIFICATION_SERVICE_ACCEPTOR_ALT_NAMES: ${VAULT_CERT_SERVICE_ALT_NAMES_FILE_ACCEPTOR}
      VAULT_CERTIFICATION_SERVICE_ACCEPTOR_TTL: ${VAULT_CERT_SERVICE_TTL}
      VAULT_CERTIFICATION_SERVICE_ACCEPTOR_IP_SANS: ${SERVER_IP}
    depends_on:
      - minio
    networks:
      - flink-network

  frontend:
    image: frolikoveabitdive/bitdive-front:latest
    container_name: frontend
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL}
      REACT_APP_KEYCLOAK_URL: ${REACT_APP_KEYCLOAK_URL}
      REACT_APP_KEYCLOAK_REALM: ${REACT_APP_KEYCLOAK_REALM}
      REACT_APP_KEYCLOAK_CLIENT_ID: ${REACT_APP_KEYCLOAK_CLIENT_ID}
      GENERATE_SOURCEMAP: ${GENERATE_SOURCEMAP}
      REACT_APP_BASE_URL: ${URL_FRONT_SYSTEM}
    restart: unless-stopped
    networks:
      - flink-network

  mcp-server:
    image: frolikoveabitdive/docker-file-mcp-server:latest
    container_name: mcp-server
    environment:
      MONITORING_API_URL: https://monitoring-api:8083
    restart: unless-stopped
    networks:
      - flink-network


networks:
  flink-network:
    driver: bridge